name: universal_ai_hub
description: "Universal AI Hub — bring-your-own-key AI chat client for multiple providers (OpenAI-compatible, Anthropic, Gemini, Custom APIs)."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local / secure storage
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Markdown + syntax highlighting for AI responses
  flutter_markdown: ^0.7.4
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  share_plus: ^12.0.2
  file_picker: ^11.0.3
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
